networks:
  - - { layer_type: invariant_based_convolution,
        activation: 'LeakyReLU',
        activation_kwargs: { negative_slope: 0.1 },
        bias: False,
        heads: [1],
        labels: [
          { label_type: wl_labeled_edges, depth: [1] }
        ],
        properties: [
          { name: distances, values: [ 0,1,2,3,4,5,6 ] },
        ]
  }
    - { layer_type: invariant_based_aggregation,
        activation: 'tanh',
        bias: True,
        heads: [1],
        labels: [
          { label_type: wl_labeled_edges, depth: [ 2 ] },
        ]
    }
    - { layer_type: reshape }