# datasets: list of datasets to be used for the experiment
# -name: "DHFR", name of the dataset (if type is TUDataset, the name can be any of the datasets from
# -validation_folds: 10, number of validation folds
# -network_config_file: path to the experiment configuration file
# -type: type of the dataset, options: [TUDataset, generate_from_function]
# -generate_function: if type is generate_from_function, the name of the function to generate the dataset from src/utils/SyntheticGraphs.py
# -generate_function_args: if type is generate_from_function, the arguments for the generate function as a dictionary
datasets:
  - {name: "DHFR", validation_folds: 10, network_config_file: "Examples/TUExample/Configs/config_experiment.yml", type: "TUDataset"}

# paths: paths to the data, properties, labels, results and splits
paths:
  # Path to the folder containing the graph data
  data: "Examples/TUExample/Data/"
  # Precomputed properties will be saved and loaded from this folder
  properties: "Examples/TUExample/Data/Properties/"
  # Path to the folder containing the labels
  labels: "Examples/TUExample/Data/Labels/"
  # Results will be saved in this folder
  results: "Examples/TUExample/Results/"
  # Path to the folder containing the data splits
  splits: "Examples/TUExample/Data/Splits/"


#### data options
# balance_training: balance the training data, set to True to balance the training data
#  - True
#  - False
balance_training: False

# mode: mode of the experiment, there are two modes one for debugging and one for running the experiments
#   - debug
#   - experiments
mode: experiments # options: [debug, experiments] if debug printing and plotting options are enabled, for the experiments mode should be 'experiments'

# device: the device to use, cpu is recommended as it is faster at the moment
#   - cpu (recommended)
#   - cuda
device: cpu

### Experiment options
# batch_size: batch size used for training, use several options for hyperparameter search, use None to set the batch size to the size of the dataset
batch_size:
  - 64

# learning_rate: learning rate used for training, use several options for hyperparameter search
learning_rate:
  - 0.01

# epochs: number of epochs used for training, use several options for hyperparameter search
epochs:
  - 200

# dropout: dropout rate used for training, use several options for hyperparameter search
dropout:
  - 0.0

# weight_decay: weight decay used for training, use several options for hyperparameter search (TODO)
weight_decay:
  - 0.0

# optimizer: optimizer used for training, use several options for hyperparameter search
optimizer:
  - Adam

# loss: loss function used for training, use several options for hyperparameter search
loss:
  - CrossEntropyLoss

# scheduler: learning rate scheduler used for training, use several options for hyperparameter search (TODO: different schedulers),
#  - False
#  - True (each 5 epochs the learning rate is reduced by a factor of 0.5)
scheduler: False

# early_stopping: early stopping used for training, enabled can be set to True or False, patience is the number of epochs to wait for improvement of the validation accuracy
early_stopping:
  enabled:
    True
  patience:
    25

# rule_occurrence_threshold: threshold that determines how often a weight has to be present to be used in the network for message passing
rule_occurrence_threshold: 3

# rule_occurrence_upper_threshold: threshold that determines how often a weight has to be present to be used in the network for message passing
rule_occurrence_upper_threshold: 20

# weight initialization: weight initialization for the network
# - type: [constant, uniform, normal]
# - value: value for the initialization for constant,
# - min: minimum value for the initialization for uniform,
# - max: maximum value for the initialization for uniform,
# - mean: mean value for the initialization for normal,
# - std: standard deviation for the initialization for normal
weight_initialization: { convolution: { type: 'uniform', min: -0.1, max: 0.1 },
                         convolution_bias: { type: 'constant', value: 0.0 },
                         aggregation: { type: 'uniform', min: -0.1, max: 0.1 },
                         aggregation_bias: { type: 'constant', value: 0.0 }}

# Pruning options (TODO: not tested yet)
prune:
  # enabled: enable pruning
  enabled: False
  # prune after this many epochs
  epochs: 25
  # number of total weights pruned at the end of training per layer (0.1 means 10% of the weights will be pruned)
  percentage:
    - 0.999
    - 0.5

# precision: precision of the model, can be set to float or double
#  - float
#  - double
precision: double

# input_features: determine how the input features should be transformed, the following options show some examples
#  - {name: constant, value: 1.0}, use a constant value as input feature
#  - {name: node_labels, transformation: normalize}, use node labels and normalize them between -1 and 1
#  - {name: node_labels, transformation: normalize_positive}, use node labels and normalize them between 0 and 1
#  - {name: node_labels, transformation: unit_circle, features_as_channels: True}, use node labels mapped to the 2D unit circle, use features as channels
#  - {name: node_labels, transformation: one_hot, features_as_channels: True}, use node labels and transform them to one-hot encoding
#  - {name: node_features, features_as_channels: True}, use node features as inpu, use features as channels
#  - {name: all, features_as_channels: True}, use node labels and node features as input, use features as channels
input_features: { name: constant, value: 1.0 }

# num_workers: number of workers used
num_workers: 4

# best_model: compute test set accuracy directly
#best_model: False
# save_last: save the last model
#save_last: False




