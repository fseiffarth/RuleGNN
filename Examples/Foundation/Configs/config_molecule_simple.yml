networks:
  - - { layer_type: invariant_based_convolution ,
        bias: False,
        heads: [1],
        labels: [
          { label_type: [wl_labeled], depth: [1] }
        ],
        properties: [
          { name: distances, values: [ 0, 1 ] },
        ]
    }
    - { layer_type: invariant_based_aggregation,
      bias: True,
      heads: [1],
      labels: [
        { label_type: degree },
      ]
    }
    - { layer_type: reshape }