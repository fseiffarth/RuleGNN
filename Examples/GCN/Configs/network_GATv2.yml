networks:
- - { layer_type: linear,
      out_features: 16,
      bias: True,
      activation: torch.nn.ReLU(),
    }
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 16,
      activation: torch.nn.ReLU(),
      batch_norm: True,
      heads: 4,
      residual: True,
    }
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 16,
      activation: torch.nn.ReLU(),
            batch_norm: True,
            heads: 4,
            residual: True,
}
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 16,
      activation: torch.nn.ReLU(),
            batch_norm: True,
            heads: 4,
            residual: True,
  }
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 16,
      activation: torch.nn.ReLU(),
            batch_norm: True,
            heads: 4,
            residual: True,
  }
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 16,
      activation: torch.nn.ReLU(),
      batch_norm: True,
            heads: 4,
            residual: True,
  }
