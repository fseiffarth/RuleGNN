networks:
- - { layer_type: linear,
      out_features: 64,
      bias: True,
      activation: torch.nn.ReLU(),
    }
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 64,
      activation: torch.nn.ReLU(),
      batch_norm: True,
      residual: True,
}
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 64,
      activation: torch.nn.ReLU(),
            batch_norm: True,
        residual: True,
}
  - { layer_type: gatv2_convolution,
      bias: True,
      out_channels: 64,
      activation: torch.nn.ReLU(),
            batch_norm: True,
        residual: True,
  }
  - { layer_type: global_pooling,
        mode: mean,
    }
  - { layer_type: linear,
      out_features: 64,
      bias: True,
      activation: torch.nn.ReLU(),
  }
  - { layer_type: linear,
      out_features: 2,
      bias: True,
      activation: torch.nn.ReLU(),
  }