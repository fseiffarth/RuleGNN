loss:
  - BCE
networks:
  - - { layer_type: convolution ,
        labels: [
          { label_type: wl, depth: [ 3,2,1,0 ] },
          { label_type: simple_cycles, max_cycle_length: [ 6, 10, 20 ] },
          {label_type: primary},
        ],
        properties: [
          { name: distances, values: [ 1,2,3,4,5,6 ] },
        ]
  }
    - { layer_type: aggregation,
        labels: [
          { label_type: wl, depth: [4,3,2,1,0] },
          { label_type: simple_cycles, max_cycle_length: [6, 10, 20] },
          { label_type: primary }
        ]
    }

input_features: {name: node_labels, transformation: normalize}

