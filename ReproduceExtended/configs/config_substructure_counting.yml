networks:
  - - { layer_type: convolution ,
      bias: False,
      heads: [
        {
          bias: False,
          labels: {
            head: { label_type: simple_cycles, min_cycle_length: 3 , max_cycle_length: 3 },
            tail: { label_type: simple_cycles, min_cycle_length: 3 , max_cycle_length: 3 },
            bias: { label_type: simple_cycles, min_cycle_length: 3 , max_cycle_length: 3 },
          },
          properties:
            { name: distances, values: [ 0 ] },
        },
        {
          bias: False,
          labels: {
            head: { label_type: simple_cycles, min_cycle_length: 4 , max_cycle_length: 4 },
            tail: { label_type: simple_cycles, min_cycle_length: 4 , max_cycle_length: 4 },
            bias: { label_type: simple_cycles, min_cycle_length: 4 , max_cycle_length: 4 },
          },
          properties:
            { name: distances, values: [ 0 ] },
        },
        {
          bias: False,
          labels: {
            head: { label_type: simple_cycles, min_cycle_length: 5 , max_cycle_length: 5 },
            tail: { label_type: simple_cycles, min_cycle_length: 5 , max_cycle_length: 5 },
            bias: { label_type: simple_cycles, min_cycle_length: 5 , max_cycle_length: 5 },
          },
          properties:
            { name: distances, values: [ 0 ] },
        },
        {
          bias: False,
          labels: {
            head: { label_type: simple_cycles, min_cycle_length: 6 , max_cycle_length: 6 },
            tail: { label_type: simple_cycles, min_cycle_length: 6 , max_cycle_length: 6 },
            bias: { label_type: simple_cycles, min_cycle_length: 6 , max_cycle_length: 6 },
          },
          properties:
            { name: distances, values: [ 0 ] },
        },
      ],
  }
    - { layer_type: linear,
        mode: 'aggr_heads',
        output_features: 10,
        bias: True,
        activation: 'tanh'
    }
    - { layer_type: aggregation,
        bias: True,
        out_dim: 10,
        heads: [
          {
            bias: True,
            labels: { label_type: simple_cycles, min_cycle_length: 3 , max_cycle_length: 3 },
          },
          {
            bias: True,
            labels: { label_type: simple_cycles, min_cycle_length: 4, max_cycle_length: 4 },
          },
          {
            bias: True,
            labels: { label_type: simple_cycles, min_cycle_length: 5, max_cycle_length: 5 },
          },
          {
            bias: True,
            labels: { label_type: simple_cycles, min_cycle_length: 6, max_cycle_length: 6 },
          }
        ],
    }
    - { layer_type: linear,
        mode: 'aggr_heads',
        output_features: 1,
        bias: True,
        activation: 'Relu'
    }
    - { layer_type: reshape,
        shape: [1, -1]}
    - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 1,
        bias: True,
        activation: 'Relu'
    }
    - { layer_type: reshape}