datasets:
  - {
      name: "ogbg-molhiv",
      task: "graph_classification",
      validation_folds: 1,
      with_splits: False,
      split_function: ogb_molhiv_splits,
      experiment_config_file: "ReproduceExtended/configs/network_molhiv_multihead.yml",
      type: 'OGB_GraphProp',
  }
