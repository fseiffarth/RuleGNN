#  - { input_dimension: 10, output_dimension: 1, bias: True }

# if subgraph labels are used the corresponding list of subgraphs should be provided here:
subgraphs:
  - "[nx.cycle_graph(6), nx.cycle_graph(7), nx.cycle_graph(8)]"
  - "[nx.cycle_graph(6), nx.cycle_graph(7), nx.cycle_graph(8), nx.cycle_graph(9), nx.cycle_graph(10)]"
  - "[nx.cycle_graph(6), nx.cycle_graph(7), nx.cycle_graph(8), nx.cycle_graph(9), nx.cycle_graph(10), nx.cycle_graph(11), nx.cycle_graph(12)]"