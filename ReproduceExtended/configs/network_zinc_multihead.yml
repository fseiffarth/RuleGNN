networks:
  - - { layer_type: convolution ,
      bias: True,
      heads: [
        {
          bias: True,
          labels: {
            head: { label_type: [induced_cycles, primary], min_cycle_length: 6 , max_cycle_length: 6 },
            tail: { label_type: [induced_cycles, primary], min_cycle_length: 6 , max_cycle_length: 6 },
            bias: { label_type: wl_labeled, depth: 2},
          },
          properties:
            { name: distances, values: [1,2,3,4] },
        },
        {
          bias: True,
          labels: {
            head: { label_type: [induced_cycles, primary], min_cycle_length: 7 , max_cycle_length: 7 },
            tail: { label_type: [induced_cycles, primary], min_cycle_length: 7 , max_cycle_length: 7 },
            bias: { label_type: wl_labeled, depth: 2},
          },
          properties:
            { name: distances, values: [ 1,2,3,4] },
        },
        {
          bias: True,
          labels: {
            head: { label_type: [induced_cycles, primary], min_cycle_length: 8 , max_cycle_length: 8 },
            tail: { label_type: [induced_cycles, primary], min_cycle_length: 8 , max_cycle_length: 8 },
            bias: { label_type: wl_labeled, depth: 2},
          },
          properties:
            { name: distances, values: [ 1,2,3,4] },
        }
      ],
  }
    - { layer_type: linear,
      mode: 'aggr_heads',
      output_features: 100,
      bias: True,
      activation: 'LeakyReLU',
    }
    - { layer_type: aggregation,
        bias: True,
        out_dim: 10,
        heads: [
          {
            bias: True,
            labels: { label_type: wl_labeled, depth: 1, base_labels : { label_type: [induced_cycles, primary], min_cycle_length: 6 , max_cycle_length: 6 }},
          },
          {
            bias: True,
            labels: { label_type: wl_labeled, depth: 1, base_labels : { label_type: [induced_cycles, primary], min_cycle_length: 7 , max_cycle_length: 7 }},
          },
          {
            bias: True,
            labels: { label_type: wl_labeled, depth: 1, base_labels : { label_type: [induced_cycles, primary], min_cycle_length: 8 , max_cycle_length: 8 }},
          }
        ],
    }
    - { layer_type: reshape}
    - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 1,
        bias: True,
        activation: 'None',
    }
    - { layer_type: reshape}