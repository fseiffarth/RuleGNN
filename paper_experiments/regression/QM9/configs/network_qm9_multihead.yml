networks:
  - - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 10,
        bias: True,
        activation: 'LeakyReLU',
  }
    - { layer_type: layer_norm }
    - { layer_type: convolution ,
        bias: False,
        activation: 'None',
        heads: [
          {
            bias: False,
            labels: {
              head: { label_type: [ induced_cycles, primary ], min_cycle_length: 6 , max_cycle_length: 6 },
              tail: { label_type: [ induced_cycles, primary ], min_cycle_length: 6 , max_cycle_length: 6 },
                bias: { label_type: [ induced_cycles, primary ], min_cycle_length: 6 , max_cycle_length: 6 },
            },
            properties:
              { name: distances, values: [ 0,1 ] },
          },
          {
            bias: False,
            labels: {
              head: { label_type: [ induced_cycles, primary ], min_cycle_length: 7 , max_cycle_length: 7 },
              tail: { label_type: [ induced_cycles, primary ], min_cycle_length: 7 , max_cycle_length: 7 },
              bias: { label_type: [ induced_cycles, primary ], min_cycle_length: 7 , max_cycle_length: 7 },
            },
            properties:
              { name: distances, values: [ 0,1 ] },
          },
          {
            bias: False,
            labels: {
              head: { label_type: [ induced_cycles, primary ], min_cycle_length: 8 , max_cycle_length: 8 },
              tail: { label_type: [ induced_cycles, primary ], min_cycle_length: 8 , max_cycle_length: 8 },
                bias: { label_type: [ induced_cycles, primary ], min_cycle_length: 8 , max_cycle_length: 8 },
            },
            properties:
              { name: distances, values: [ 0,1 ] },
          },
        ],
    }
    - { layer_type: linear,
        mode: 'aggr_heads',
        output_features: 100,
        bias: True,
        activation: 'LeakyReLU',
    }
    - { layer_type: layer_norm }

    - { layer_type: aggregation,
        activation: 'None',
        bias: True,
        out_dim: 10,
        heads: [
          {
            bias: True,
            labels: { label_type: [ induced_cycles, primary ], min_cycle_length: 6 , max_cycle_length: 6 },
          },
          {
            bias: True,
            labels: { label_type: [ induced_cycles, primary ], min_cycle_length: 7 , max_cycle_length: 7 },
          },
          {
            bias: True,
            labels: { label_type: [ induced_cycles, primary ], min_cycle_length: 8 , max_cycle_length: 8 },
          }
        ],
    }
    - { layer_type: reshape }
    - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 100,
        bias: True,
        activation: 'LeakyReLU',
    }
    - { layer_type: layer_norm }
    - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 100,
        bias: True,
        activation: 'LeakyReLU',
    }
    - { layer_type: linear,
        mode: 'aggr_features',
        output_features: 1,
        bias: True,
        activation: 'None',
    }
    - { layer_type: reshape }
